<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TFDA 食品邊境不合格監測 V2</title><style>
body{margin:0;font-family:Arial,'Noto Sans TC',sans-serif;color:#513746;background:linear-gradient(135deg,#fff3f8,#ffd8e8)}header{padding:28px 5%;background:#ffffffcc;border-bottom:1px solid #efd5df}h1{margin:0 0 6px}.wrap{max-width:1400px;margin:auto;padding:20px 5%}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fffdfebf;border:1px solid #efd5df;border-radius:16px;padding:18px;margin-bottom:16px}.num{font-size:28px;font-weight:bold;color:#c94f7d;margin-top:5px}.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.filters input,.filters select{width:100%;padding:10px;margin-top:5px;border:1px solid #e4c7d3;border-radius:9px;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:9px;background:#c94f7d;color:white;margin:10px 6px 0 0;cursor:pointer}button.alt{background:white;color:#c94f7d;border:1px solid #e0b7c8}table{width:100%;border-collapse:collapse;background:white;font-size:13px}th,td{padding:10px;border-bottom:1px solid #f1e0e7;text-align:left;white-space:nowrap}th{background:#fff0f6}.table{overflow:auto;border-radius:12px}.badge{display:inline-block;padding:7px 10px;border-radius:99px;background:white;border:1px solid #efd5df;margin-right:6px;font-size:13px}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:550px){.cards{grid-template-columns:1fr}.filters{grid-template-columns:1fr}}</style></head><body>
<header><h1>TFDA 食品邊境不合格監測</h1><div>V2 雲端自動更新版｜每日檢查 TFDA 官方公開資料</div></header><main class="wrap">
<div><span class="badge" id="status">載入中…</span><span class="badge" id="latest">最新日期：—</span></div>
<section class="cards"><div class="card">目前篩選筆數<div class="num" id="n">0</div></div><div class="card">近30日案件<div class="num" id="d30">0</div></div><div class="card">涉及進口商<div class="num" id="imp">0</div></div><div class="card">主要類型<div class="num" id="top">—</div></div></section>
<section class="panel"><div class="filters"><label>地區<select id="region"><option value="">全部</option><option>北部</option><option>中部</option><option>南部</option><option>東部</option><option>離島</option><option>未判定</option></select></label><label>不合格類型<select id="reason"></select></label><label>產地<select id="origin"></select></label><label>日期起<input id="from" type="date"></label><label>日期迄<input id="to" type="date"></label><label>關鍵字<input id="kw" placeholder="產品／進口商／原因"></label></div><button onclick="apply()">套用篩選</button><button class="alt" onclick="resetAll()">清除</button><button class="alt" onclick="csv()">匯出 CSV</button><button class="alt" onclick="open('https://data.gov.tw/dataset/6133','_blank')">官方資料集</button></section>
<section class="panel table"><table><thead><tr><th>發布日期</th><th>地區</th><th>產品／主旨</th><th>進口商</th><th>產地</th><th>不合格類型</th><th>可能批號</th><th>原因</th></tr></thead><tbody id="body"></tbody></table></section>
<section class="panel"><b>資料說明</b><p>每日同步代表每日檢查官方資料；TFDA 資料集目前標示更新頻率為每7日。北／中／南為依進口商地址自行分類；「可能批號」為文字推測，不是 TFDA 官方獨立欄位。</p></section></main>
<script>
let data=[],out=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){try{let r=await fetch('data.json?t='+Date.now());if(!r.ok)throw 0;data=await r.json();$('status').textContent='✓ 已載入雲端資料'}catch(e){data=[{發布日期:'—',地區:'未判定',主旨:'等待首次同步',進口商名稱:'—',產地:'—',不合格類型:'其他',可能批號:'—',原因:'請至 GitHub Actions 執行 Daily TFDA Sync'}];$('status').textContent='⚠ 尚未同步，顯示提示資料'}fill();apply()}
function fill(){for(let [id,k] of [['reason','不合格類型'],['origin','產地']])$(id).innerHTML='<option value="">全部</option>'+[...new Set(data.map(x=>x[k]).filter(Boolean))].sort().map(x=>'<option>'+esc(x)+'</option>').join('')}
function apply(){let r=$('region').value,s=$('reason').value,o=$('origin').value,f=$('from').value,t=$('to').value,k=$('kw').value.toLowerCase().trim();out=data.filter(x=>(!r||x.地區==r)&&(!s||x.不合格類型==s)&&(!o||x.產地==o)&&(!f||x.發布日期>=f)&&(!t||x.發布日期<=t)&&(!k||Object.values(x).join(' ').toLowerCase().includes(k)));render();stats()}
function render(){$('body').innerHTML=out.slice(0,3000).map(x=>'<tr><td>'+esc(x.發布日期)+'</td><td>'+esc(x.地區)+'</td><td>'+esc(x.主旨)+'</td><td>'+esc(x.進口商名稱)+'</td><td>'+esc(x.產地)+'</td><td>'+esc(x.不合格類型)+'</td><td>'+esc(x.可能批號)+'</td><td>'+esc(x.原因)+'</td></tr>').join('')||'<tr><td colspan=8>沒有符合資料</td></tr>'}
function stats(){$('n').textContent=out.length;let cut=Date.now()-30*864e5;$('d30').textContent=out.filter(x=>new Date(x.發布日期)>=cut).length;$('imp').textContent=new Set(out.map(x=>x.進口商名稱).filter(Boolean)).size;let c={};out.forEach(x=>c[x.不合格類型]=(c[x.不合格類型]||0)+1);$('top').textContent=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';let ds=data.map(x=>x.發布日期).filter(x=>x&&x!='—').sort();$('latest').textContent='最新日期：'+(ds.at(-1)||'—')}
function resetAll(){['region','reason','origin','from','to','kw'].forEach(x=>$(x).value='');apply()}function csv(){let h=['發布日期','地區','主旨','進口商名稱','產地','不合格類型','可能批號','原因'];let s=[h.join(','),...out.map(x=>h.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download='tfda_border_filtered.csv';a.click()}load();
</script></body></html>
